<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧园区可视化大屏</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-card: #12121a;
            --gold-primary: #d4af37;
            --gold-light: #f5d78e;
            --gold-dark: #a68a2e;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --border-gold: rgba(212, 175, 55, 0.3);
            --glow-gold: rgba(212, 175, 55, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景网格纹理 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .dashboard {
            position: relative;
            z-index: 1;
            padding: 20px;
            max-width: 1920px;
            margin: 0 auto;
        }

        /* 顶部标题栏 */
        .header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-gold);
            position: relative;
        }

        .header::before,
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        .header::before { left: 50%; transform: translateX(-200px); }
        .header::after { left: 50%; transform: translateX(100px); }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px var(--glow-gold);
            letter-spacing: 8px;
        }

        .header .datetime {
            margin-top: 15px;
            font-size: 1.2rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        .header .datetime span {
            color: var(--gold-primary);
        }

        /* 主内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            grid-template-rows: auto auto;
            gap: 25px;
        }

        /* 左侧卡片区 */
        .left-panel {
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 卡片通用样式 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-light), var(--gold-dark));
        }

        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--glow-gold) 0%, transparent 60%);
            pointer-events: none;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }

        .card-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-title svg {
            width: 18px;
            height: 18px;
            stroke: var(--gold-primary);
        }

        .card-value {
            font-size: 2.8rem;
            font-weight: 600;
            color: var(--gold-light);
            font-family: 'Playfair Display', serif;
            line-height: 1;
        }

        .card-value .unit {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-left: 5px;
        }

        .card-sub {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .card-sub .up {
            color: #4ade80;
        }

        .card-sub .down {
            color: #f87171;
        }

        /* 中间图表区 */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .chart-card {
            flex: 1;
            min-height: 300px;
        }

        .chart-card .chart-container {
            height: 280px;
            position: relative;
        }

        /* 右侧面板 */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .donut-chart {
            height: 180px;
        }

        /* 告警列表 */
        .alert-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .alert-list::-webkit-scrollbar {
            width: 4px;
        }

        .alert-list::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .alert-list::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 2px;
        }

        .alert-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(248, 113, 113, 0.1);
            border-left: 3px solid #f87171;
            border-radius: 0 8px 8px 0;
            animation: fadeInRight 0.4s ease-out forwards;
            opacity: 0;
        }

        .alert-item:nth-child(1) { animation-delay: 0.5s; }
        .alert-item:nth-child(2) { animation-delay: 0.6s; }
        .alert-item:nth-child(3) { animation-delay: 0.7s; }
        .alert-item:nth-child(4) { animation-delay: 0.8s; }

        .alert-item.warning {
            background: rgba(251, 191, 36, 0.1);
            border-left-color: #fbbf24;
        }

        .alert-item.info {
            background: rgba(96, 165, 250, 0.1);
            border-left-color: #60a5fa;
        }

        .alert-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .alert-message {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        /* 底部地图区 */
        .map-panel {
            grid-column: 1 / -1;
            min-height: 350px;
        }

        .map-panel .chart-container {
            height: 320px;
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 环境指标 */
        .env-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .env-item {
            text-align: center;
            padding: 10px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 8px;
        }

        .env-item .value {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--gold-light);
        }

        .env-item .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 响应式 */
        @media (max-width: 1400px) {
            .main-content {
                grid-template-columns: 240px 1fr 260px;
            }
            .header h1 {
                font-size: 2.4rem;
            }
        }

        @media (max-width: 1100px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .left-panel {
                grid-row: auto;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .card {
                flex: 1;
                min-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- 顶部标题栏 -->
        <header class="header">
            <h1>智慧园区可视化平台</h1>
            <div class="datetime">
                <span id="currentDate"></span> · <span id="currentTime"></span>
            </div>
        </header>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 左侧数据卡片 -->
            <div class="left-panel">
                <!-- 访客统计 -->
                <div class="card">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        今日访客
                    </div>
                    <div class="card-value" id="visitorCount">0</div>
                    <div class="card-sub">较昨日 <span class="up" id="visitorChange">+0%</span></div>
                </div>

                <!-- 能耗数据 -->
                <div class="card">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                        </svg>
                        今日能耗
                    </div>
                    <div class="card-value"><span id="energyValue">0</span><span class="unit">kWh</span></div>
                    <div class="card-sub">较昨日 <span class="down" id="energyChange">-0%</span></div>
                </div>

                <!-- 设备状态 -->
                <div class="card">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                            <line x1="8" y1="21" x2="16" y2="21"></line>
                            <line x1="12" y1="17" x2="12" y2="21"></line>
                        </svg>
                        设备在线
                    </div>
                    <div class="card-value"><span id="deviceOnline">0</span><span class="unit">/ <span id="deviceTotal">0</span></span></div>
                    <div class="card-sub">在线率 <span class="up" id="deviceRate">0%</span></div>
                </div>

                <!-- 环境监测 -->
                <div class="card">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
                        </svg>
                        环境监测
                    </div>
                    <div class="env-grid">
                        <div class="env-item">
                            <div class="value" id="temperature">0°C</div>
                            <div class="label">温度</div>
                        </div>
                        <div class="env-item">
                            <div class="value" id="humidity">0%</div>
                            <div class="label">湿度</div>
                        </div>
                        <div class="env-item">
                            <div class="value" id="aqi">0</div>
                            <div class="label">空气质量</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 中间趋势图 -->
            <div class="center-panel">
                <div class="card chart-card">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                        24小时访客趋势
                    </div>
                    <div class="chart-container">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 右侧面板 -->
            <div class="right-panel">
                <div class="card donut-chart">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        设备在线率
                    </div>
                    <div class="chart-container">
                        <canvas id="donutChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        实时告警
                    </div>
                    <div class="alert-list" id="alertList"></div>
                </div>
            </div>

            <!-- 底部地图 -->
            <div class="card map-panel">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                        <line x1="8" y1="2" x2="8" y2="18"></line>
                        <line x1="16" y1="6" x2="16" y2="22"></line>
                    </svg>
                    园区区域分布
                </div>
                <div class="chart-container" id="mapChart"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 模拟数据生成 ====================
        function generateMockData() {
            return {
                visitor: {
                    today: Math.floor(Math.random() * 500 + 800),
                    yesterday: Math.floor(Math.random() * 400 + 600),
                    trend: Array.from({length: 24}, () => Math.floor(Math.random() * 80 + 20))
                },
                energy: {
                    value: Math.floor(Math.random() * 2000 + 3000),
                    change: (Math.random() * 10 - 5).toFixed(1)
                },
                device: {
                    online: Math.floor(Math.random() * 30 + 170),
                    total: 200
                },
                env: {
                    temperature: (Math.random() * 10 + 20).toFixed(1),
                    humidity: Math.floor(Math.random() * 30 + 40),
                    aqi: Math.floor(Math.random() * 50 + 30)
                },
                alerts: [
                    { time: '10:23:45', message: 'A3栋电梯2号故障告警', level: 'error' },
                    { time: '09:15:32', message: '地下车库A区照明异常', level: 'warning' },
                    { time: '08:42:18', message: '空调系统2号机组维护提醒', level: 'info' },
                    { time: '昨天 22:30:00', message: '消防通道占用告警已消除', level: 'info' }
                ]
            };
        }

        // ==================== 数字滚动动画 ====================
        function animateNumber(element, target, duration = 1000) {
            const start = parseInt(element.textContent) || 0;
            const increment = (target - start) / (duration / 16);
            let current = start;

            const timer = setInterval(() => {
                current += increment;
                if ((increment > 0 && current >= target) || (increment < 0 && current <= target)) {
                    element.textContent = target;
                    clearInterval(timer);
                } else {
                    element.textContent = Math.floor(current);
                }
            }, 16);
        }

        // ==================== 更新时间 ====================
        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });
            const timeStr = now.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('currentDate').textContent = dateStr;
            document.getElementById('currentTime').textContent = timeStr;
        }

        // ==================== 图表初始化 ====================
        let trendChart, donutChart, mapChart;

        function initCharts() {
            // 24小时趋势图
            const trendCtx = document.getElementById('trendChart').getContext('2d');

            // 创建金色渐变
            const goldGradient = trendCtx.createLinearGradient(0, 200, 0, 0);
            goldGradient.addColorStop(0, 'rgba(212, 175, 55, 0.0)');
            goldGradient.addColorStop(1, 'rgba(212, 175, 55, 0.4)');

            trendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}:00`),
                    datasets: [{
                        label: '访客数',
                        data: [],
                        borderColor: '#d4af37',
                        backgroundColor: goldGradient,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointHoverBackgroundColor: '#f5d78e'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(212, 175, 55, 0.1)' },
                            ticks: { color: '#a0a0a0' }
                        },
                        y: {
                            grid: { color: 'rgba(212, 175, 55, 0.1)' },
                            ticks: { color: '#a0a0a0' }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });

            // 环形图
            const donutCtx = document.getElementById('donutChart').getContext('2d');
            donutChart = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                    labels: ['在线', '离线'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#d4af37', '#3a3a4a'],
                        borderWidth: 0,
                        circumference: 360,
                        rotation: -90
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // 地图
            mapChart = echarts.init(document.getElementById('mapChart'));
            const mapOption = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c}台设备'
                },
                visualMap: {
                    min: 0,
                    max: 50,
                    text: ['高', '低'],
                    realtime: false,
                    calculable: true,
                    inRange: {
                        color: ['#1a1a2e', '#d4af37', '#f5d78e']
                    },
                    textStyle: { color: '#a0a0a0' },
                    right: 20,
                    top: 'center'
                },
                series: [{
                    type: 'map',
                    map: 'none',
                    roam: true,
                    emphasis: {
                        label: { color: '#fff' },
                        itemStyle: { borderColor: '#d4af37', borderWidth: 2 }
                    }
                }]
            };

            // 模拟地图数据 - 智慧园区平面图
            const buildingData = [
                { name: 'A1栋', value: [20, 30], count: 35 },
                { name: 'A2栋', value: [40, 30], count: 42 },
                { name: 'A3栋', value: [60, 30], count: 28 },
                { name: 'B1栋', value: [20, 50], count: 38 },
                { name: 'B2栋', value: [40, 50], count: 45 },
                { name: 'B3栋', value: [60, 50], count: 33 },
                { name: 'C区', value: [80, 40], count: 25 },
                { name: 'D区', value: [20, 70], count: 18 },
                { name: 'E区', value: [50, 70], count: 22 },
                { name: 'F区', value: [75, 65], count: 15 }
            ];

            mapOption.series[0].data = buildingData.map(item => ({
                name: item.name,
                value: item.value.concat(item.count)
            }));

            mapChart.setOption(mapOption);
        }

        // ==================== 更新数据 ====================
        function updateDashboard() {
            const data = generateMockData();

            // 更新数字
            animateNumber(document.getElementById('visitorCount'), data.visitor.today);
            document.getElementById('visitorChange').textContent =
                `${data.visitor.today > data.visitor.yesterday ? '+' : ''}${((data.visitor.today - data.visitor.yesterday) / data.visitor.yesterday * 100).toFixed(1)}%`;
            document.getElementById('visitorChange').className = data.visitor.today >= data.visitor.yesterday ? 'up' : 'down';

            animateNumber(document.getElementById('energyValue'), data.energy.value);
            document.getElementById('energyChange').textContent = `${data.energy.change > 0 ? '+' : ''}${data.energy.change}%`;
            document.getElementById('energyChange').className = data.energy.change <= 0 ? 'up' : 'down';

            animateNumber(document.getElementById('deviceOnline'), data.device.online);
            document.getElementById('deviceTotal').textContent = data.device.total;
            document.getElementById('deviceRate').textContent = ((data.device.online / data.device.total) * 100).toFixed(1) + '%';

            document.getElementById('temperature').textContent = data.env.temperature + '°C';
            document.getElementById('humidity').textContent = data.env.humidity + '%';
            document.getElementById('aqi').textContent = data.env.aqi;

            // 更新图表
            trendChart.data.datasets[0].data = data.visitor.trend;
            trendChart.update('none');

            donutChart.data.datasets[0].data = [data.device.online, data.device.total - data.device.online];
            donutChart.update('none');

            // 更新告警列表
            const alertList = document.getElementById('alertList');
            alertList.innerHTML = data.alerts.map(alert => `
                <div class="alert-item ${alert.level}">
                    <div class="alert-time">${alert.time}</div>
                    <div class="alert-message">${alert.message}</div>
                </div>
            `).join('');
        }

        // ==================== 初始化 ====================
        function init() {
            updateDateTime();
            setInterval(updateDateTime, 1000);
            initCharts();
            updateDashboard();
            setInterval(updateDashboard, 5000);

            // 响应式
            window.addEventListener('resize', () => {
                trendChart.resize();
                donutChart.resize();
                mapChart.resize();
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
